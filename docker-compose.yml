services:
  whalegod:
    build: .
    container_name: whalegod-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - whalegod-data:/app/data
    ports:
      - "${WEBHOOK_PORT:-9876}:${WEBHOOK_PORT:-9876}"
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whalegod-data:
